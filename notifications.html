<!DOCTYPE html>
<html lang="en">
<head>

<link rel="icon" href="assets/logo.png" type="image/png">
<title>Notifications — HAR Animasi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="sidebarRoot"></div>
<div class="app-sidebar-overlay" id="sidebarOverlay"></div>

<main class="app-main">
  <header class="app-topbar" id="topbarRoot"></header>

  <div class="app-content" id="pageContent" style="max-width:720px;">
    <div class="section-toolbar">
      <div class="page-header" style="margin-bottom:0;">
        <h1>NOTIFICATIONS</h1>
        <p class="text-secondary">Updates about your auditions and applications.</p>
      </div>
      <button class="btn btn-outline btn-sm" id="markAllReadBtn">MARK ALL READ</button>
    </div>

    <div id="notificationsList">
      <div class="card skeleton" style="height:80px; margin-bottom:10px;"></div>
      <div class="card skeleton" style="height:80px; margin-bottom:10px;"></div>
      <div class="card skeleton" style="height:80px;"></div>
    </div>
  </div>
</main>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="dashboard.js"></script>
<script>initNotificationsPage();</script>
